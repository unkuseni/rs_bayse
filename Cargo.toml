[package]
name = "rs_bayse"
version = "0.1.0"
edition = "2021"
readme = "README.md"
license = "MIT"
categories = ["api-bindings"]
description = "Bayse Markets API bindings in Rust"
repository = "https://github.com/unkuseni/rs_bayse"
authors = ["unkuseni <twitter.com/unkuseni>"]

[lib]
name = "bayse"
path = "src/lib.rs"

[dependencies]
derive_more = { version = "2.0.1", features = ["full"] }
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
reqwest = { version = "0.12.12", features = ["json"] }
tokio-tungstenite = { features = ["native-tls"], version = "0.29.0" }
tokio = { version = "1.40.0", features = ["full"] }
url = "2.5.0"
once_cell = "1.19.0"
chrono = "0.4.31"
rand = "0.10.1"
futures = "0.3.25"
thiserror = "2.0.18"
log = "0.4.27"
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
